<g class="m" font-size="13.5" xml:space="preserve"><text x="48" y="384" clip-path="url(#t0)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">./webserv config/default.conf &amp;</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.08458;0.97;1" values="0;1;0;0"/><text x="48" y="406"><tspan fill="#58a6ff">[INFO] Listening on 0.0.0.0:8080 (fd=4)</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.09708;0.97;1" values="0;1;0;0"/><text x="48" y="428"><tspan fill="#58a6ff">[INFO] Server event loop starting...</tspan></text></g><text x="48" y="450" clip-path="url(#t3)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">curl -si localhost:8080/ | head -1</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.18958;0.97;1" values="0;1;0;0"/><text x="48" y="472"><tspan fill="#3fb950">HTTP/1.1 200 OK</tspan></text></g><text x="48" y="494" clip-path="url(#t5)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">curl -si -X DELETE localhost:8080/ | head -1</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.29042;0.97;1" values="0;1;0;0"/><text x="48" y="516"><tspan fill="#d29922">HTTP/1.1 405 Method Not Allowed</tspan></text></g><text x="48" y="538" clip-path="url(#t7)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">curl -si -d &#x27;hi&#x27; localhost:8080/upload_store/hi.txt | head -1</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.41250;0.97;1" values="0;1;0;0"/><text x="48" y="560"><tspan fill="#3fb950">HTTP/1.1 201 Created</tspan></text></g><text x="48" y="582" clip-path="url(#t9)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">curl &#x27;localhost:8080/cgi-bin/hello.pl?lang=perl&#x27;</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.51833;0.97;1" values="0;1;0;0"/><text x="48" y="604"><tspan fill="#e6edf3">Hello from CGI (perl)</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.51833;0.97;1" values="0;1;0;0"/><text x="48" y="626"><tspan fill="#e6edf3">METHOD=GET</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.51833;0.97;1" values="0;1;0;0"/><text x="48" y="648"><tspan fill="#e6edf3">QS=lang=perl</tspan></text></g><text x="48" y="670" clip-path="url(#t13)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">curl -si localhost:8080/cgi-bin/loop.py | head -1</tspan><tspan fill="#8b949e">   # infinite loop</tspan></text><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.73958;0.97;1" values="0;1;0;0"/><text x="48" y="692"><tspan fill="#f85149">HTTP/1.1 504 Gateway Timeout</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="24.0s" repeatCount="indefinite" keyTimes="0;0.76458;0.97;1" values="0;1;0;0"/><text x="48" y="714"><tspan fill="#3fb950">$ </tspan></text><rect x="64.2" y="702" width="8.1" height="15" fill="#e6edf3"><animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect></g></g>
