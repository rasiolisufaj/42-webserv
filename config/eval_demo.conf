# Demo config to prove the dashboard is config-portable.
# Deliberately DIFFERENT from default.conf: another port, server_name, and
# upload directory -- but the SAME route layout (/, /cgi-bin, /upload_store,
# /errors), which is all the dashboard depends on.
server  {
    listen 0.0.0.0:9090;                 # different port
    server_name webserv.eval;            # different name
    client_max_body_size 2048000;
    client_max_header_size 8192;
    error_page  404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;
    upload_store www/upload_store_rasiol; # different upload dir
    root www;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
    }
    location /upload_store{
        allow_methods GET POST DELETE;
        upload_store www/upload_store_rasiol;
        autoindex on;
    }
    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }
    location /redirect {
        return 302 https://www.google.com;
    }
}
