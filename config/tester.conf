server {
    listen 8080;
    server_name localhost;
    root www;
    upload_store www/cgi-bin;

    location /cgi-bin {
        root www;
        cgi .py /opt/homebrew/bin/python3; 
    }
}

server {
    listen 8082;
    server_name localhost;
    root www;
    upload_store www/cgi-bin;

    location / {
        allow_methods GET HEAD;
        index index1.html;
        autoindex on;
    }
}

server {
    listen 9090;
    server_name localhost;
    root www;
    upload_store www/cgi-bin;

    location /cgi-bin {
        allowed_method GET POST;
        root www;
        cgi .py /opt/homebrew/bin/python3; 
        cgi .sh /bin/bash;
    }
}
