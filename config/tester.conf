server {
    listen 255.255.255.255:8080;
    server_name localhost;
    client_max_body_size 200;
    client_max_header_size 80;
    error_page 400 /errors/404.html;
    error_page 500 /errors/500.html;
    upload_store ./www/public;
location / {
    allow_methods POST GET;
    root ./www/data;
    index index.html;
    client_max_body_size 200;
    autoindex on;
    cgi .py /opt/homebrew/bin/python3;
    cgi .sh /bin/bash;
}
location /files {
    allow_methods  DELETE ;
    root ./www/data;
    index index.html;
    autoindex off;
    return 400; #Valid
    upload_store ./www/public;
    cgi .py /usr/bin/python3;
    }
}
