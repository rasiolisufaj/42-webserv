server {
    listen 255.255.255.255:8080;
    server_name localhost;
    client_max_body_size 200;
    error_page 400 /errors/404.html;
    error_page 500 /errors/500.html;
    upload_store ./www/upload_store;
location / {
    allow_methods POST DELETE GET;
    root ./www/data;
    index index.html;
    autoindex on;
    return 301 www.google.com;
    upload_store ./www/upload_store;
    cgi .sh ./tests/test_basic.sh;
    cgi .len /usr/bin/python3;
    #cgi .py /usr/bin;

    client_max_body_size 200;
    }
location /files {
    allow_methods  DELETE ;
    root ./www/data;
    index index.html;
    autoindex off;
    return 400; #Valid
    upload_store ./www/upload_store;
    cgi .py /usr/bin/python3;
    }
}
