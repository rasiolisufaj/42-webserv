server  {
    listen 125.125.125.125:8080;
    server_name pepe;
    client_max_body_size 40;
    client_max_header_size 54;
    error_page  400 /errors/404.html;
    error_page 500 /errors/500.html;
    upload_store ./www/cgi-bin;
location / {
   allow_methods POST DELETE GET HEAD;
    root ./www/data;
    index index.html;
    autoindex on;
    return 301 www.google.com;
    upload_store ./www/upload_store;
    #cgi .sh ./tests/test_basic.sh;
    cgi .len /usr/bin/python3;
    #cgi .py /usr/bin;

    client_max_body_size 60;
    }
location /files {
    allow_methods  DELETE ;
    root ./www/data;
    index index.html;
    autoindex off;
    return 400; #Valid
    upload_store ./www/public;
    cgi .py /usr/bin/python3;
    }
}
