server {
    listen 8080;
    server_name localhost servidor_test www.ejemplo.com;
    client_max_body_size 500;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
location /api {
    allow_methods POST DELETE GET;
    root ./www/data;
    index index.html;
    autoindex on;
    return 301 https://google.com;
    upload_store ./www/uploads;
    cgi .sh ./tests/test_basic.sh;
    cgi .py /usr/bin/python3;
    client_max_body_size 100;
    }
location /files {
    allow_methods  DELETE ;
    root ./www/data;
    index index.html;
    autoindex off;
    return 400; #Valid
    upload_store ./www/uploads;
    cgi .py /usr/bin/python3;
    }
}

server {
    listen 9000;
    server_name localhost;
    client_max_body_size 4000;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location /files {
        allow_methods  DELETE ;
        root ./www/data;
        index index.html;
        autoindex off;
        return 400; #Valid
        upload_store ./www/uploads;
        cgi .py /usr/bin/python3;
    }
}