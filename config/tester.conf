server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1000000;
    error_page 404 /errors/404.html;

    location / {
        allow_methods GET POST;
        root ./www;
        index index.html;
        autoindex on;
    }

    location /uploads {
        allow_methods POST DELETE;
        root ./www/uploads;
    }

    location /cgi-bin {
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }
}

server {
    listen 9090;
    server_name secondary.com;

    location /old {
        return 301 /new-page;
    }
}