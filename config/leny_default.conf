server  {
    listen 0.0.0.0:8080;
    server_name localhost;      
    client_max_body_size 28;
    #client_max_body_size 2048000; #Size in bytes (~2 MB)
    client_max_header_size 8192; #size in bytes (8 KB)
    error_page  404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;
    upload_store www/upload_store;
    root www;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
        }
    location /upload_store{
        allow_methods GET POST DELETE;
        upload_store www/upload_store;
        autoindex on;
    }
    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }
    location /redirect {
		return 302 https://www.google.com;
	}
    location /leny {
        allow_methods GET;
        root www/admin;
        autoindex on;
        #autoindex off;
    }
}