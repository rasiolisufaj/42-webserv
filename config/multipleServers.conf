server {
    listen 0.0.0.0:8080;
    server_name localhost;
    root www;
    #upload_store www/upload_store;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
    }
}
server {
    listen 127.0.0.1:9090;
    server_name localhost;
    root www;
    upload_store www/upload_store;
    location / {
        allow_methods GET HEAD;
        index index1.html;
        autoindex on;
    }
}
server {
    listen 127.0.0.1:9000;
    server_name localhost;
    root www;
    upload_store www/upload_store;
    location /cgi-bin {
        allow_methods GET POST;
        root www;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
    }
}
