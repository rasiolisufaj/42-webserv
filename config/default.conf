server  {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2000; #Size in kylobytes
    client_max_header_size 8; #size in kylobytes
    error_page  404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;
    upload_store www/upload_store;
    root www;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
        }
    location /upload{
        allow_methods GET POST DELETE;
        upload_store www/admin;
        autoindex on;
    }
    location /admin{
        allow_methods GET;
        autoindex off;
    }
    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }
    location /redirect {
		return 302 https://www.google.com;
	}
    location /kapouet {
        allow_methods GET;
        root www/admin; # http://127.0.0.1:8080/kapouet/dashboard.html
    }
}

server {
    listen 127.0.0.1:9000;
    server_name localhost;
    error_page 404 /errors/404.html;
    upload_store www/upload_store;
    root www;

    location / {
        allow_methods GET HEAD;
        index index1.html;
        autoindex on;
        }
}
