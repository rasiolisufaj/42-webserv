#Test for CGI
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 100000;
	client_max_header_size 800;
    error_page 404 www/errors/404.html;
	upload_store www/upload_store/;

    location / {
		root ./www;
        allow_methods GET POST DELETE;
        autoindex off;
    }

    location /upload_store {
		root ./www;
        allow_methods GET POST DELETE;
        upload_path www/upload_store/;
        autoindex on;
    }
    location /cgi-bin {
		root ./www;
        allow_methods GET POST DELETE;
   		cgi .py /opt/homebrew/bin/python3;
    	cgi .sh /bin/bash;
    }
}

server {
    listen 9090;
    server_name server_b;
    client_max_body_size 512;
    error_page 404 www/errors/404.html;
	upload_store www/upload_store/;

    location / {
		root ./www;
        allow_methods GET;
        autoindex off;
    }
}
