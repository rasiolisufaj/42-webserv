server  {
    listen 0.0.0.0:8080;
    server_name localhost;
    client_max_body_size 2048000; #Size in bytes (~2 MB)
    client_max_header_size 8192; #size in bytes (8 KB)
    error_page  404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;
    upload_store www/upload_store;
    root www;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
        }
    location /upload_store{
        allow_methods GET POST DELETE;
        # Single upload dir. URL path == dir-under-root, so all four operations
        # hit www/upload_store: GET/autoindex map root+/upload_store, while
        # POST/DELETE target upload_store. (Inherits the server upload_store.)
        upload_store www/upload_store;
        autoindex on;
    }
    location /admin{
        allow_methods GET;
        autoindex off;
    }
    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        cgi .pl /usr/bin/perl;
    }
    location /redirect {
		return 302 https://www.google.com;
	}
    location /kapouet {
        allow_methods GET;
        # root + full URI mapping (no alias): the kapouet/ dir exists under root
        # so GET /kapouet/dashboard.html -> www/admin/kapouet/dashboard.html (200)
        root www/admin;
    }
}