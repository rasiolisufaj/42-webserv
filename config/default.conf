server  {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2048000; #Size in bytes (~2 MB)
    client_max_header_size 8192; #size in bytes (8 KB)
    error_page  404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 413 /errors/413.html;
    upload_store www/upload_store;
    root www;
    location / {
        allow_methods GET HEAD;
        index index.html;
        autoindex on;
        }
    location /upload{
        allow_methods GET POST DELETE;
        # GET browses root+/upload (www/upload); POST/DELETE target upload_store.
        # They must point at the same dir so uploaded files are browsable here.
        upload_store www/upload;
        autoindex on;
    }
    location /admin{
        allow_methods GET;
        autoindex off;
    }
    location /cgi-bin {
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }
    location /redirect {
		return 302 https://www.google.com;
	}
    location /kapouet {
        allow_methods GET;
        # root + full URI mapping (no alias): the kapouet/ dir exists under root
        # so GET /kapouet/dashboard.html -> www/admin/kapouet/dashboard.html (200)
        root www/admin;
    }
}